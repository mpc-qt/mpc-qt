name: AppImage maker

on:
  [workflow_call]

env:
  DEVBUILD: continuous

jobs:
  appimage:
    name: Build
    runs-on: ubuntu-latest
    container: ghcr.io/pkgforge-dev/archlinux:latest

    steps:
    - name: Install packages
      run: |
        pacman -Syu --noconfirm \
            base-devel \
            cmake \
            ninja \
            git  \
            boost \
            mpv \
            pipewire-audio \
            pipewire-jack \
            qt6-svg \
            qt6-tools \
            udisks2 \
            vulkan-headers \
            qt6ct \
            kvantum \
            lxqt-qtplugin \
            libva-intel-driver \
            wget \
            patchelf \
            xorg-server-xvfb \
    - name: Checkout repository
      uses: actions/checkout@v6.0.2
      with:
        fetch-depth: 1000
        fetch-tags: true
    - name: Configure build
      run: |
        git config --global --add safe.directory /__w/mpc-qt/mpc-qt
        VERSION=$( cat .github/actions/data/VERSION )
        echo "MPC-QT_PACKAGE_VERSION=$VERSION" >> $GITHUB_ENV
        if [[ $VERSION != $DEVBUILD ]]; then
          cmake -DMPCQT_VERSION=$VERSION -DCMAKE_INSTALL_PREFIX=/usr -G Ninja -B build
        else
          cmake -DCMAKE_INSTALL_PREFIX=/usr -G Ninja -B build
        fi
    - name: Build MPC-QT
      run: cmake --build build
    - name: Install MPC-QT
      run: sudo cmake --install build
    - name: Install debloated packages
      run: |
        EXTRA_PACKAGES="https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/refs/heads/main/useful-tools/get-debloated-pkgs.sh"
        wget "$EXTRA_PACKAGES" -O ./get-debloated-pkgs.sh
        chmod +x ./get-debloated-pkgs.sh
        ./get-debloated-pkgs.sh --add-common --prefer-nano \
            glycin-mini \
            qt6-base-mini \
            libxml2-mini \
            opus-mini \
            sdl2_image-mini \
            icu-mini \
            intel-media-driver-mini \
            ffmpeg-mini
    - name: Setup Sharun (Anylinux tool)
      run: |
        echo "ICON=/usr/share/icons/hicolor/scalable/apps/io.github.mpc_qt.mpc-qt.svg" >> $GITHUB_ENV
        echo "DESKTOP=/usr/share/applications/io.github.mpc_qt.mpc-qt.desktop" >> $GITHUB_ENV
        echo "ADD_HOOKS=self-updater.hook:get-yt-dlp.hook" >> $GITHUB_ENV
        echo "UPINFO=gh-releases-zsync|mpc-qt|mpc-qt|latest|mpc-qt-linux-x64-*.AppImage.zsync" >> $GITHUB_ENV
        echo "OUTPATH=./" >> $GITHUB_ENV
        echo "OUTNAME=mpc-qt-linux-x64-${{env.MPC-QT_PACKAGE_VERSION}}.AppImage" >> $GITHUB_ENV
        SHARUN="https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/refs/heads/main/useful-tools/quick-sharun.sh"
        wget -c "$SHARUN" -O ./quick-sharun
        chmod +x ./quick-sharun
    - name: Build AppImage
      run: |
        ./quick-sharun /usr/bin/mpc-qt
        ./quick-sharun --make-appimage
    - name: Upload AppImage
      uses: actions/upload-artifact@v7
      with:
        name: "mpc-qt-x86_64-AppImage"
        path: ./mpc-qt[-_]*.AppImage
    - name: Upload AppImage autoupdate zsync file
      uses: actions/upload-artifact@v7
      with:
        name: "mpc-qt-x86_64-AppImage-zsync"
        path: ./mpc-qt[-_]*.AppImage.zsync
