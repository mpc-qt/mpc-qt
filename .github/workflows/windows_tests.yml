name: Msys2 CI Tests

on:
  workflow_call:
    inputs:
      arch:
        description: "Architecture of the build to test: x64 or arm64"
        type: string
        default: x64

jobs:
  tests:
    name: Tests
    runs-on: ${{ inputs.arch == 'arm64' && 'windows-11-arm' || 'windows-2025' }}
    defaults:
      run:
        shell: msys2 {0}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6.0.2
    - name: Download mpc-qt build
      uses: actions/download-artifact@v8.0.1
    - name: Install packages
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ inputs.arch == 'arm64' && 'clangarm64' || 'ucrt64' }}
        update: true
        install: >-
          coreutils

    - name: Get mpc-qt dir
      run: |
        dir_name=$(ls -d mpc-qt-win*/mpc-qt-*/ | head -n 1)
        echo "Directory found: $dir_name"
        echo "EXEDIR=$dir_name" >> $GITHUB_ENV

    - name: Set CONFIGDIR environment variable
      run: echo "CONFIGDIR=$(cygpath -u $USERPROFILE)/AppData/Roaming/mpc-qt/mpc-qt" >> $GITHUB_ENV

    - name: Cache dep
      if: inputs.arch != 'arm64'
      id: cache
      uses: actions/cache@v5.0.4
      with:
        path: |
          ${{ env.EXEDIR }}x64\opengl32.dll
          ${{ env.EXEDIR }}x64\libglapi.dll
        key: ${{ runner.os }}-gldlls

    # The mingw mesa package doesn't include libglapi.dll, so we need to download a build
    - name: Download Mesa DLLs
      if: inputs.arch != 'arm64' && steps.cache.outputs.cache-hit != 'true'
      shell: cmd
      run: |
        curl.exe -L --output mesa.7z --url https://github.com/pal1000/mesa-dist-win/releases/download/20.3.2/mesa3d-20.3.2-release-msvc.7z
        7z x mesa.7z
      working-directory: ${{ env.EXEDIR }}

    - name: Configure Mesa DLLs
      if: inputs.arch != 'arm64'
      shell: cmd
      run: |
        mklink opengl32.dll "x64\opengl32.dll"
        mklink libglapi.dll "x64\libglapi.dll"
      working-directory: ${{ env.EXEDIR }}

    # There's no ARM64 build of the Mesa release used above, so use the mingw
    # one with its llvmpipe driver. Mesa's default driver on Windows is d3d12,
    # which didn't work with mpc-qt on the ARM64 runner.
    - name: Install Mesa (ARM64)
      if: inputs.arch == 'arm64'
      run: |
        pacman -S --noconfirm --needed mingw-w64-clang-aarch64-mesa
        for dll in opengl32.dll libgallium_wgl.dll; do
          cp "$MINGW_PREFIX/bin/$dll" "$EXEDIR"
          ldd "$MINGW_PREFIX/bin/$dll" | awk '/=>/ {print $3}' | while read -r dep; do
            if [[ "$dep" == "$MINGW_PREFIX"* ]]; then
              cp -n "$dep" "$EXEDIR"
            fi
          done
        done
        echo "GALLIUM_DRIVER=llvmpipe" >> $GITHUB_ENV

    # The ARM64 runner starts with Windows' "Choose privacy settings for your
    # device" screen open, and the Start menu open behind it, both covering
    # mpc-qt in the screenshots. Close them, and turn the setup screen off for
    # later sign-ins. Windows restarts the Start menu process in the
    # background, closed.
    - name: Close the Windows setup screen and Start menu (ARM64)
      if: inputs.arch == 'arm64'
      shell: pwsh
      run: |
        reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows\OOBE" /v DisablePrivacyExperience /t REG_DWORD /d 1 /f
        Get-Process -Name WWAHost -ErrorAction SilentlyContinue | Stop-Process -Force
        Start-Sleep 2
        Get-Process -Name StartMenuExperienceHost -ErrorAction SilentlyContinue | Stop-Process -Force

    - name: Start with config and video
      uses: ./.github/actions/windows/tests/start_with_config_video

    - name: Start without config
      uses: ./.github/actions/windows/tests/start

    - name: Upload screenshots
      if: ${{ !cancelled() }}
      uses: ./.github/actions/commands/upload_screenshots
