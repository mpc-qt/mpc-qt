name: Linux CI

on:
  [workflow_call]

env:
  DEVBUILD: continuous

jobs:
  build:
    name: Build
    runs-on: ubuntu-26.04

    steps:
    - name: Install packages
      run: |
        sudo apt-get update
        sudo apt-get -y --no-install-recommends install \
        build-essential \
        cmake \
        libboost-stacktrace-dev \
        libgl-dev \
        libmpv-dev \
        linguist-qt6 \
        qt6-tools-dev \
        qt6-base-dev \
        libqt6svg6-dev \
    - uses: actions/checkout@v6.0.2
      with:
        fetch-depth: 1000
        fetch-tags: true
    - name: Set version
      run: |
        echo "FORCE_VERSION=" >> $GITHUB_ENV
        VERSION=$( cat .github/actions/data/VERSION )
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        if [ $VERSION != $DEVBUILD ]; then
            echo "FORCE_VERSION=-DMPCQT_VERSION=$( cat .github/actions/data/VERSION )" >> $GITHUB_ENV
        fi
    - name: cmake
      run: cmake $FORCE_VERSION -DCMAKE_BUILD_TYPE=RelWithDebInfo -G Ninja -B build
    - name: Build
      run: cmake --build build
    - name: Save, strip and link symbols
      run: |
        cd bin
        objcopy --only-keep-debug mpc-qt mpc-qt.dbg
        objcopy --strip-debug mpc-qt
        objcopy --add-gnu-debuglink=mpc-qt.dbg mpc-qt
    - name: Upload executable
      uses: actions/upload-artifact@v7
      with:
        name: "mpc-qt-linux-x64-${{ env.VERSION }}"
        path: bin/mpc-qt
    - name: Upload symbols file
      uses: actions/upload-artifact@v7
      with:
        name: "mpc-qt-linux-x64-debug_symbols-${{ env.VERSION }}"
        path: bin/mpc-qt.dbg
