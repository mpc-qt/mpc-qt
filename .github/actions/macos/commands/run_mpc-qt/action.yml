name: Run mpc-qt
description: "Run mpc-qt and wait for it to start then check if it's running"

inputs:
  filename:
    description: "File to open with mpc-qt"
    required: false
    default: ""
runs:
  using: "composite"

  steps:
  - name: Run mpc-qt and open a file if provided
    run: mpc-qt/MPC-QT.app/Contents/MacOS/mpc-qt ${{ inputs.filename }} &
    shell: bash
  - name: wait 10 seconds
    run:  sleep 10
    shell: bash
  - name: check that mpc-qt is running
    uses: ./.github/actions/macos/commands/check_if_running
    with:
      should_be_running: "yes"
